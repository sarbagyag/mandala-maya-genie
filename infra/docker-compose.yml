version: "3.9"
services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    env_file:
      - ../.env
    environment:
      - POSTGRES_DB=maya
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maya"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  channel-adapter:
    build: ../services/channel-adapter
    ports:
      - "8081:8081"
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=8081
      - ALLOWED_ORIGINS=
    depends_on:
      - redis

  orchestrator:
    build: ../services/orchestrator
    ports:
      - "8082:8082"
    environment:
      - REDIS_URL=redis://redis:6379
      - COGNITIVE_CORE_URL=http://cognitive-core:8083
      - PORT=8082
    depends_on:
      - redis
      - cognitive-core

  cognitive-core:
    build: ../services/cognitive-core
    ports:
      - "8083:8083"
    env_file:
      - ../.env
    depends_on:
      - redis
      - postgres

volumes:
  redis_data:
  pgvector_data:
